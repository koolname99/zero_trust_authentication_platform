services:
  mongodb:
    image: mongo:8
    container_name: ztap_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ztap
      MONGO_INITDB_ROOT_PASSWORD: ztap_secret
      MONGO_INITDB_DATABASE: zero_trust_auth
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ztap_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ztap_redis_secret
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
